name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  packages: write

# A new push supersedes whatever was already running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tag per-ref, so a branch that edits .devcontainer/** builds the image once
  # in the job below and every other job pulls that build instead of repeating
  # it.
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer
  DEVCONTAINER_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'latest' }}

jobs:
  # Builds the devcontainer image once and publishes it, so the jobs below pull
  # a ready image instead of each rebuilding it. Previously every job set
  # `cacheFrom` while also setting `push: never`, so nothing was ever published
  # for the cache to hit and each one rebuilt the LLVM layer from scratch —
  # about 83 seconds per job.
  devcontainer:
    name: Devcontainer image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          imageTag: ${{ env.DEVCONTAINER_TAG }}
          # main's image is the base cache; a pull request additionally reuses
          # its own previous build, so a second push to the same PR hits.
          cacheFrom: |
            ${{ env.DEVCONTAINER_IMAGE }}:latest
            ${{ env.DEVCONTAINER_IMAGE }}:${{ env.DEVCONTAINER_TAG }}
          push: always
          runCmd: |
            set -euo pipefail
            clang --version

  build-and-test:
    name: Build & Test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    needs: devcontainer
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            preset: debug-clang
            build_dir: debug/clang
          - compiler: gcc
            preset: debug-gcc
            build_dir: debug/gcc
          - compiler: clang
            preset: release-clang
            build_dir: release/clang
          - compiler: gcc
            preset: release-gcc
            build_dir: release/gcc

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # vcpkg needs full history to resolve the manifest's builtin-baseline.
          # Fetching it with the checkout replaces a separate
          # `git fetch --unshallow`, which intermittently failed with
          # "fatal: shallow file has changed since we read it".
          fetch-depth: 0

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-${{ matrix.preset }}-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & test
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:${{ env.DEVCONTAINER_TAG }}
          push: never
          runCmd: |
            set -euo pipefail
            mkdir -p .vcpkg-binary-cache
            export VCPKG_DEFAULT_BINARY_CACHE="$PWD/.vcpkg-binary-cache"
            ./third/vcpkg/bootstrap-vcpkg.sh
            cmake --workflow --preset=${{ matrix.preset }}
            mkdir -p build/test-results
            ./build/${{ matrix.build_dir }}/test/unit_test \
              --gtest_output=xml:build/test-results/unit_test.xml
            ./build/${{ matrix.build_dir }}/test/integration_test \
              --gtest_output=xml:build/test-results/integration_test.xml
            ./build/${{ matrix.build_dir }}/test/thread_safety_test \
              --gtest_output=xml:build/test-results/thread_safety_test.xml

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.preset }}
          path: build/test-results/*.xml

      - name: Publish test report
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results (${{ matrix.preset }})
          path: build/test-results/*.xml
          reporter: java-junit

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    needs: devcontainer
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan-ubsan
            preset: sanitize-clang
          - sanitizer: tsan
            preset: tsan-clang

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unshallow vcpkg submodule
        run: git -C third/vcpkg fetch --unshallow

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.sanitizer }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.sanitizer }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-${{ matrix.sanitizer }}-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test under sanitizers
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:${{ env.DEVCONTAINER_TAG }}
          push: never
          runCmd: |
            set -euo pipefail
            mkdir -p .vcpkg-binary-cache
            export VCPKG_DEFAULT_BINARY_CACHE="$PWD/.vcpkg-binary-cache"
            ./third/vcpkg/bootstrap-vcpkg.sh
            cmake --workflow --preset=${{ matrix.preset }}

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: devcontainer

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unshallow vcpkg submodule
        run: git -C third/vcpkg fetch --unshallow

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-static-analysis-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-static-analysis-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-static-analysis-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run clang-format and clang-tidy
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:${{ env.DEVCONTAINER_TAG }}
          push: never
          runCmd: |
            set -euo pipefail
            mkdir -p .vcpkg-binary-cache
            export VCPKG_DEFAULT_BINARY_CACHE="$PWD/.vcpkg-binary-cache"
            ./third/vcpkg/bootstrap-vcpkg.sh

            # Formatting is a hard gate: the tree is clean today.
            git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run --Werror

            # Configuring is enough for clang-tidy: the compilation database
            # already covers every public header, because the self-containment
            # check generates one translation unit per header. Running it over
            # the database is what gives the headers coverage — clang-tidy has
            # no compile command for a bare .h file.
            cmake --preset=config-debug-clang

            # Reported, not enforced. The tree carries pre-existing findings
            # (readability-identifier-naming, misc-no-recursion and friends);
            # add -warnings-as-errors once those are triaged.
            run-clang-tidy -p build/debug/clang | tee clang-tidy.log
            grep -c ' warning: ' clang-tidy.log || true

  consumer:
    name: Consume as a package
    runs-on: ubuntu-latest
    needs: devcontainer

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unshallow vcpkg submodule
        run: git -C third/vcpkg fetch --unshallow

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-consumer-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-consumer-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-consumer-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and consume via find_package
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:${{ env.DEVCONTAINER_TAG }}
          push: never
          runCmd: |
            set -euo pipefail
            mkdir -p .vcpkg-binary-cache
            export VCPKG_DEFAULT_BINARY_CACHE="$PWD/.vcpkg-binary-cache"
            ./third/vcpkg/bootstrap-vcpkg.sh
            cmake --preset=config-release-clang -DCMAKE_INSTALL_PREFIX="$PWD/build/install"
            cmake --build build/release/clang
            cmake --install build/release/clang
            test -f build/install/lib/cmake/cppfig/cppfig-config.cmake
            test -f build/install/include/cppfig/thread_policy.h

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: devcontainer

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # vcpkg needs full history to resolve the manifest's builtin-baseline.
          # Fetching it with the checkout replaces a separate
          # `git fetch --unshallow`, which intermittently failed with
          # "fatal: shallow file has changed since we read it".
          fetch-depth: 0

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-coverage-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-coverage-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-coverage-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build devcontainer and run coverage
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:${{ env.DEVCONTAINER_TAG }}
          push: never
          runCmd: |
            set -euo pipefail
            mkdir -p .vcpkg-binary-cache
            export VCPKG_DEFAULT_BINARY_CACHE="$PWD/.vcpkg-binary-cache"
            ./third/vcpkg/bootstrap-vcpkg.sh
            cmake --workflow --preset=coverage
            ninja -C build/coverage coverage
            ninja -C build/coverage coverage-xml
            echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            llvm-cov report \
              build/coverage/test/unit_test \
              --object=build/coverage/test/integration_test \
              --object=build/coverage/test/thread_safety_test \
              -instr-profile=build/coverage/coverage.profdata \
              "-ignore-filename-regex=(third|test|benchmark|build|examples|vcpkg_installed)/.*" \
              2>/dev/null >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage/coverage/
            build/coverage/coverage/coverage.lcov
